<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リポジトリコンテンツ検索 — JAIRO Cloud</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* ===== ナビゲーション ===== */
  .ext-nav { display:flex; gap:0; margin-bottom:12px; border-bottom:2px solid #c8e6c9; }
  .ext-nav a { padding:6px 16px; text-decoration:none; font-size:0.9em; color:#555; border:1px solid transparent; border-bottom:none; border-radius:4px 4px 0 0; }
  .ext-nav a.active { background:#fff; color:#2c5f2e; font-weight:bold; border-color:#c8e6c9; margin-bottom:-2px; }
  .ext-nav a:hover:not(.active) { background:#e8f5e9; }
  /* ===== ベーススタイル ===== */
  body {
    font-family: sans-serif;
    font-size: 14px;
    color: #333;
    background: #f5f5f5;
    margin: 20px;
  }
  h1 { color: #2c5f2e; font-size: 1.4em; margin-bottom: 16px; }

  /* ===== 検索フォーム ===== */
  #search-section {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .form-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .form-row label {
    width: 90px;
    flex-shrink: 0;
    color: #555;
    font-size: 12px;
  }
  .form-row input[type="text"],
  .form-row input[type="url"],
  .form-row select {
    flex: 1;
    min-width: 0;
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  .form-row input:focus,
  .form-row select:focus {
    outline: none;
    border-color: #4caf50;
    box-shadow: 0 0 0 2px rgba(76,175,80,0.15);
  }
  .form-hint {
    font-size: 11px;
    color: #888;
    margin: -4px 0 8px 90px;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  #btn-search {
    background: #2c5f2e;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 7px 24px;
    font-size: 13px;
    cursor: pointer;
  }
  #btn-search:hover { background: #1e4020; }
  #btn-search:disabled { background: #aaa; cursor: not-allowed; }

  /* ===== メッセージ ===== */
  #error-msg {
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 12px;
    line-height: 1.8;
    white-space: pre-wrap;
  }
  #error-msg.warn {
    background: #fff3cd;
    border: 1px solid #ffc107;
  }
  #error-msg.cors {
    background: #f8d7da;
    border: 1px solid #f5c2c7;
  }
  #loading { text-align: center; padding: 24px; color: #888; }
  .hidden { display: none !important; }

  /* ===== 結果情報 ===== */
  #result-info { font-size: 12px; color: #555; margin-bottom: 10px; }

  /* ===== アイテムカード ===== */
  .item-card {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .item-title {
    font-size: 14px;
    font-weight: bold;
    color: #2c5f2e;
    cursor: pointer;
    line-height: 1.4;
    display: inline-block;
    border: none;
    background: none;
    padding: 0;
    text-align: left;
  }
  .item-title:hover { text-decoration: underline; }
  .item-title::before { content: '\25B6\00a0'; font-size: 10px; color: #888; }
  .item-title.open::before { content: '\25BC\00a0'; }
  .item-meta { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.5; }
  .item-files { font-size: 12px; margin-top: 4px; }
  .item-files a { color: #2c5f2e; margin-right: 10px; text-decoration: none; }
  .item-files a:hover { text-decoration: underline; }
  .item-url { font-size: 11px; color: #888; margin-top: 4px; word-break: break-all; }
  .item-url a { color: #888; }

  /* ===== 展開詳細 ===== */
  .item-detail {
    margin-top: 10px;
    border-top: 1px solid #eee;
    padding-top: 10px;
  }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .detail-table tr { border-bottom: 1px solid #f0f0f0; }
  .detail-table th {
    width: 100px;
    text-align: left;
    vertical-align: top;
    padding: 4px 6px 4px 0;
    color: #666;
    font-weight: normal;
    white-space: nowrap;
  }
  .detail-table td { padding: 4px 6px; vertical-align: top; line-height: 1.6; }
  .detail-desc { white-space: pre-wrap; }
  .detail-lang { color: #888; font-size: 10px; }

  /* ===== ページング ===== */
  #pagination {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
  }
  .page-btn {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .page-btn:hover { background: #e8f5e9; }
  .page-btn:disabled { color: #aaa; cursor: not-allowed; }
  .page-info { color: #555; }
</style>
</head>
<body>
<nav class="ext-nav">
  <a href="panel.html">DOIインポート</a>
  <a href="funder_panel.html">助成情報検索</a>
  <a href="opensearch_panel.html" class="active">リポジトリコンテンツ検索</a>
  <a href="openalex_panel.html">OpenAlex機関別著作検索</a>
</nav>
<h1>🔍 リポジトリコンテンツ検索</h1>

<section id="search-section">
  <div class="form-row">
    <label for="repo-url">リポジトリ URL</label>
    <input type="url" id="repo-url" placeholder="https://example.repo.nii.ac.jp/">
  </div>
  <p class="form-hint">検索対象とするリポジトリのURL</p>
  <div class="form-row">
    <label for="q-title">タイトル</label>
    <input type="text" id="q-title">
  </div>
  <div class="form-row">
    <label for="q-des">内容記述</label>
    <input type="text" id="q-des">
  </div>
  <div class="form-row">
    <label for="q-type">資源タイプ</label>
    <select id="q-type">
      <option value="">-- 指定なし --</option>
    </select>
  </div>
  <div class="form-actions">
    <button id="btn-search">検索</button>
  </div>
</section>

<div id="error-msg" class="hidden"></div>
<div id="loading" class="hidden">検索中…</div>

<section id="results-section" class="hidden">
  <div id="result-info"></div>
  <div id="result-list"></div>
  <div id="pagination"></div>
</section>

<script src="opensearch_panel.js"></script>
</body>
</html>

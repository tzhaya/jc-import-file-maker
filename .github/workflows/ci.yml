name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks (JSON parse + JS syntax + UTF-8 + file sync + TSV headers)
        run: npm test

      - name: Verify E2E artifact binding
        if: github.event_name == 'pull_request'
        run: node scripts/verify-e2e-record.mjs --changed-from "${{ github.event.pull_request.base.sha }}"
